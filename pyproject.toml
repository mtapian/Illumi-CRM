[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "illumi-crm"
version = "0.1.0"
description = "CRM/ERP SaaS multiempresa para PYMEs productoras en Perú"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.18",
    "djangorestframework==3.16.1",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-bdd==9.0.0",
    "hypothesis==6.168.5",
    "ruff==0.17.0",
    "import-linter==2.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
bdd_features_base_dir = "specs"
filterwarnings = ["ignore::pytest.PytestUnknownMarkWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*", ".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.importlinter]
root_packages = ["shared", "tenancy", "catalog", "purchasing", "inventory", "production"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas de cada contexto (plan 0000 §2)"
type = "layers"
layers = ["interfaces", "infrastructure", "application", "domain"]
containers = ["shared", "tenancy", "catalog", "purchasing", "inventory", "production"]

[[tool.importlinter.contracts]]
name = "El dominio es Python puro: no importa Django"
type = "forbidden"
source_modules = [
    "shared.domain", "tenancy.domain", "catalog.domain", "purchasing.domain", "inventory.domain",
    "production.domain",
]
forbidden_modules = ["django"]

[[tool.importlinter.contracts]]
name = "El shared kernel no depende de ningún contexto"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["tenancy", "catalog", "purchasing", "inventory", "production"]

[[tool.importlinter.contracts]]
name = "Tenancy no depende del catálogo (los contextos de abajo no conocen a los de arriba)"
type = "forbidden"
source_modules = ["tenancy"]
forbidden_modules = ["catalog"]

[[tool.importlinter.contracts]]
name = "El catálogo usa tenancy solo por su fachada, sus registros y su capa web"
type = "forbidden"
source_modules = ["catalog.domain", "catalog.application"]
forbidden_modules = ["tenancy.infrastructure", "tenancy.interfaces", "tenancy.domain"]

[[tool.importlinter.contracts]]
name = "Tenancy y el catálogo no dependen de compras (la pestaña Compras la registra compras)"
type = "forbidden"
source_modules = ["tenancy", "catalog"]
forbidden_modules = ["purchasing"]

[[tool.importlinter.contracts]]
name = "Compras usa tenancy, el catálogo y el inventario solo por sus fachadas, sus registros y su capa web"
type = "forbidden"
source_modules = ["purchasing.domain", "purchasing.application"]
# Solo imports directos: la fachada del catálogo puede usar su propio dominio.
allow_indirect_imports = "True"
forbidden_modules = [
    "tenancy.infrastructure", "tenancy.interfaces", "tenancy.domain",
    "catalog.infrastructure", "catalog.interfaces", "catalog.domain",
    # Del inventario, solo su servicio (`inventory.application.servicio`; plan 0004a §6).
    "inventory.infrastructure", "inventory.interfaces", "inventory.domain",
]

[[tool.importlinter.contracts]]
name = "Tenancy y el catálogo no dependen del inventario (el inventario llena sus puertos)"
type = "forbidden"
source_modules = ["tenancy", "catalog"]
forbidden_modules = ["inventory"]

[[tool.importlinter.contracts]]
name = "El inventario usa tenancy y el catálogo solo por sus fachadas, sus registros y su capa web"
type = "forbidden"
source_modules = ["inventory.domain", "inventory.application"]
# Solo imports directos: la fachada del catálogo puede usar su propio dominio.
allow_indirect_imports = "True"
forbidden_modules = [
    "tenancy.infrastructure", "tenancy.interfaces", "tenancy.domain",
    "catalog.infrastructure", "catalog.interfaces", "catalog.domain",
    "purchasing",
]

[[tool.importlinter.contracts]]
name = "Producción usa tenancy, el catálogo y el inventario solo por sus fachadas, sus registros y su capa web"
type = "forbidden"
source_modules = ["production.domain", "production.application"]
# Solo imports directos: la fachada del catálogo puede usar su propio dominio (plan 0005a §6).
allow_indirect_imports = "True"
forbidden_modules = [
    "tenancy.infrastructure", "tenancy.interfaces", "tenancy.domain",
    "catalog.infrastructure", "catalog.interfaces", "catalog.domain",
    "inventory.infrastructure", "inventory.interfaces", "inventory.domain",
    "purchasing",
]

[[tool.importlinter.contracts]]
name = "Nadie depende de producción"
type = "forbidden"
source_modules = ["tenancy", "catalog", "purchasing", "inventory"]
forbidden_modules = ["production"]

