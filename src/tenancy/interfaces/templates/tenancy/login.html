{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="panel">
<h1>Iniciar sesión</h1>
<p class="subtitulo">Ingresa con el email de tu cuenta.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Entrar</button>
</form>
<p><a href="/password-reset/">¿Olvidaste tu contraseña?</a> · <a href="/registro/">Registra tu empresa</a></p>
</div>
{% endblock %}
