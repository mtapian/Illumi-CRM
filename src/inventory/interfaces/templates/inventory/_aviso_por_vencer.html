{% if lotes %}<ul>{% for l in lotes %}<li data-lote="{{ l.lote }}"><a href="{% url 'stock' %}?q={{ l.sku|urlencode }}">{{ l.sku }}</a> · lote {{ l.lote }} ({{ l.cantidad|floatformat:"-4" }}):
  {% if l.vencido %}<span class="chip error">Vencido</span>{% else %}{{ l.dias }} días restantes{% endif %}</li>{% endfor %}</ul>
{% else %}<p class="subtitulo">Ningún lote por vencer.</p>{% endif %}
